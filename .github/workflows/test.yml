name: Post-game contracts

on:
  workflow_call:
  pull_request:
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - "rtgs"
      - ".github/workflows/test.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate RunPod scripts
        run: |
          bash -n rtgs scripts/local/*.sh scripts/runpod/*.sh scripts/relay/*.sh deploy/runpod/*.sh
          python -m py_compile scripts/cloud.py backend/replay_server.py
      - name: Install API test dependencies
        run: pip install -r backend/requirements-dev.txt
      - name: Test analytics and API workflow
        run: pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        run: npm install --legacy-peer-deps
      - name: Build and typecheck
        working-directory: frontend
        run: npm test && npm run build
