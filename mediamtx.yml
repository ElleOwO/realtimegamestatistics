# ============================================================================
# MediaMTX Configuration
# RTSP/RTMP relay for Veo camera streaming
# ============================================================================
#
# QUICK SETUP:
#   - Veo camera pushes RTMP to: rtmp://VM_IP:1935/live
#   - Analytics engine reads RTSP from: rtsp://mediamtx:8554/live (in Docker Compose)
#
# PORTS:
#   1935 - RTMP (ingress from Veo)
#   8554 - RTSP (egress to analytics)
#   8888 - WebRTC (optional, for browser playback)

# Global settings
logLevel: info
logDestinations:
  - stdout

# RTMP server (listen for Veo camera push)
rtmp:
  enabled: true
  listen: :1935

# RTSP server (analytics engine consumes this)
rtsp:
  enabled: true
  listen: :8554

# WebRTC server (optional, for browser playback of live stream)
webrtc:
  enabled: true
  listen: :8888

# Path templates (MediaMTX auto-creates these)
paths:
  # Default path — Veo pushes RTMP to rtmp://…/live
  # and analytics reads RTSP from rtsp://…/live
  live: {}
    # Optional: record to disk
    # record: true
    # recordPath: /var/recordings/live.mp4

# UDP/TCP tuning (optional, for high-performance setups)
udpMaxPayloadSize: 1200

# Timeouts
readBufferCount: 256
readTimeout: 10s
writeTimeout: 10s
