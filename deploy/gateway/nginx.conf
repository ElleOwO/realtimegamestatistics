worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  access_log /dev/stdout;
  client_max_body_size 300m;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8080;
    server_name _;
    auth_basic "RTGS operator";
    auth_basic_user_file /run/rtgs/htpasswd;

    location = /healthz {
      auth_basic off;
      default_type application/json;
      return 200 '{"status":"ok","service":"gateway"}';
    }

    location = /healthz/live {
      auth_basic off;
      proxy_pass http://127.0.0.1:8001/health/live;
    }

    location = /healthz/ready {
      auth_basic off;
      proxy_pass http://127.0.0.1:8001/health/ready;
    }

    location = /api/runtime {
      proxy_pass http://127.0.0.1:3000/api/runtime;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /api/live/ {
      proxy_pass http://127.0.0.1:8001/api/live/;
      proxy_set_header Host $host;
    }

    location /api/v1/ {
      proxy_pass http://127.0.0.1:8000/api/v1/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }

    location /api/test/ {
      proxy_pass http://127.0.0.1:8000/api/test/;
      proxy_set_header Host $host;
    }

    location /ws {
      proxy_pass http://127.0.0.1:8001/ws;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
  }
}
