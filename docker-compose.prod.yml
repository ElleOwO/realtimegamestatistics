# ============================================================================
# USask Soccer Analytics — Production Compose Override
# ============================================================================
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# This file overrides development settings for production:
#   - Removes hot-reload volume mounts
#   - Adds resource limits
#   - Closes internal service ports (redis)
#   - Sets production-ready logging

services:
  analytics:
    # Override: remove dev volume mounts (code is baked into image)
    volumes:
      - analytics_model_cache:/root/.cache/huggingface:rw

    # Resource limits to prevent OOM
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '3.0'
        reservations:
          memory: 4G
          cpus: '2.0'

    # Production logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

    # Production logging
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    # Close redis port — only accessible within Docker network
    ports: []

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  mediamtx:
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  analytics_model_cache:
    driver: local
